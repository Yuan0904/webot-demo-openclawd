<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebBot Sidecar</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #f7f7f8;
        --sidebar-bg: #1e1e2e;
        --sidebar-text: #cdd6f4;
        --msg-bg: #fff;
        --msg-assistant-bg: #f0f0f5;
        --border: #e0e0e0;
        --primary: #6c5ce7;
        --primary-hover: #5a4bd1;
        --danger: #e74c3c;
        --text: #2c3e50;
        --text-muted: #95a5a6;
        --tool-bg: #fdf6e3;
        --code-bg: #f5f5f5;
        --radius: 8px;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        background: var(--bg);
        color: var(--text);
      }

      /* Sidebar */
      #sidebar {
        width: 260px;
        min-width: 260px;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #sidebar h2 {
        padding: 16px;
        font-size: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      #new-chat-btn {
        margin: 12px 16px;
        padding: 10px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 14px;
      }
      #new-chat-btn:hover {
        background: var(--primary-hover);
      }
      #conv-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .conv-item {
        padding: 10px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        margin-bottom: 4px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .conv-item.active {
        background: rgba(108, 92, 231, 0.3);
      }

      /* Main */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 0;
      }

      /* Messages */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #messages:empty::after {
        content: "Send a message to start a conversation.";
        color: var(--text-muted);
        text-align: center;
        margin-top: 40vh;
        font-size: 15px;
      }
      .msg {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: var(--radius);
        line-height: 1.6;
        font-size: 14px;
      }
      .msg-user {
        align-self: flex-end;
        background: var(--primary);
        color: #fff;
        border-bottom-right-radius: 2px;
      }
      .msg-assistant {
        align-self: flex-start;
        background: var(--msg-assistant-bg);
        border-bottom-left-radius: 2px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg-assistant p {
        margin-bottom: 8px;
      }
      .msg-assistant p:last-child {
        margin-bottom: 0;
      }
      .msg-assistant code {
        background: var(--code-bg);
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 13px;
      }
      .msg-assistant pre {
        background: var(--code-bg);
        padding: 10px;
        border-radius: 4px;
        overflow-x: auto;
        margin: 8px 0;
        font-size: 13px;
      }
      .msg-assistant pre code {
        background: none;
        padding: 0;
      }

      /* Thinking group */
      .thinking-group {
        align-self: flex-start;
        max-width: 80%;
        border-radius: var(--radius);
        font-size: 13px;
        margin: 4px 0;
      }
      .thinking-header {
        padding: 8px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
        color: var(--text-muted);
        border-radius: var(--radius);
        background: var(--msg-assistant-bg);
        border: 1px solid var(--border);
      }
      .thinking-header .arrow {
        transition: transform 0.2s;
        font-size: 10px;
      }
      .thinking-header .arrow.open {
        transform: rotate(90deg);
      }
      .thinking-header .thinking-spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .thinking-group.done .thinking-spinner {
        display: none;
      }
      .thinking-header .thinking-label {
        font-size: 13px;
      }
      .thinking-details {
        display: none;
        margin-top: 6px;
        margin-left: 14px;
        padding-left: 12px;
        border-left: 2px solid var(--border);
      }
      .thinking-details.open {
        display: block;
      }

      /* Tool calls (inside thinking group) */
      .tool-block {
        background: var(--tool-bg);
        border: 1px solid #e8dcc8;
        border-radius: var(--radius);
        font-size: 13px;
        margin: 4px 0;
      }
      .tool-header {
        padding: 8px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
      }
      .tool-header .arrow {
        transition: transform 0.2s;
        font-size: 10px;
      }
      .tool-header .arrow.open {
        transform: rotate(90deg);
      }
      .tool-header .tool-name {
        font-weight: 600;
      }
      .tool-header .tool-status {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-muted);
      }
      .tool-body {
        padding: 0 12px 10px;
        display: none;
      }
      .tool-body.open {
        display: block;
      }
      .tool-body pre {
        background: #fff;
        padding: 8px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
        max-height: 200px;
        overflow-y: auto;
      }

      /* Status bar */
      #status-bar {
        padding: 6px 20px;
        font-size: 12px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        background: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
      }
      #status-bar .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
      }
      #status-bar.running .spinner {
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Input */
      #input-area {
        padding: 12px 20px;
        border-top: 1px solid var(--border);
        background: #fff;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      #msg-input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 14px;
        resize: none;
        max-height: 120px;
        min-height: 42px;
        font-family: inherit;
        line-height: 1.4;
      }
      #msg-input:focus {
        outline: none;
        border-color: var(--primary);
      }
      #send-btn,
      #abort-btn {
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      #send-btn {
        background: var(--primary);
        color: #fff;
      }
      #send-btn:hover {
        background: var(--primary-hover);
      }
      #send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #abort-btn {
        background: var(--danger);
        color: #fff;
        display: none;
      }
      #abort-btn:hover {
        background: #c0392b;
      }

      /* Responsive */
      @media (max-width: 768px) {
        #sidebar {
          width: 200px;
          min-width: 200px;
        }
        .msg {
          max-width: 95%;
        }
      }
      @media (max-width: 480px) {
        #sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>WebBot</h2>
      <button id="new-chat-btn">+ New Chat</button>
      <div id="conv-list"></div>
    </div>

    <div id="main">
      <div id="messages"></div>
      <div id="status-bar">
        <div class="spinner"></div>
        <span id="status-text"></span>
      </div>
      <div id="input-area">
        <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
        <button id="send-btn">Send</button>
        <button id="abort-btn">Stop</button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const API = "";
        let conversations = [];
        let activeConvId = null;
        let activeRunId = null;
        let activeEventSource = null;
        let runStatus = "idle";

        const $messages = document.getElementById("messages");
        const $convList = document.getElementById("conv-list");
        const $input = document.getElementById("msg-input");
        const $sendBtn = document.getElementById("send-btn");
        const $abortBtn = document.getElementById("abort-btn");
        const $newChatBtn = document.getElementById("new-chat-btn");
        const $statusBar = document.getElementById("status-bar");
        const $statusText = document.getElementById("status-text");

        const STORAGE_KEY = "webbot_conversations";
        const ACTIVE_KEY = "webbot_activeConvId";

        function saveConversations() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
            if (activeConvId) localStorage.setItem(ACTIVE_KEY, activeConvId);
          } catch { /* quota exceeded, ignore */ }
        }

        function loadConversations() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length > 0) {
                // Migrate legacy tool messages into thinking-groups
                for (const conv of parsed) {
                  if (!conv.messages) continue;
                  const migrated = [];
                  let group = null;
                  for (const m of conv.messages) {
                    if (m.role === "tool") {
                      if (!group) {
                        group = { role: "thinking-group", id: genId(), tools: [], done: true };
                        migrated.push(group);
                      }
                      group.tools.push({ id: m.id, toolName: m.toolName, status: m.status || "done", result: m.result });
                    } else {
                      group = null;
                      migrated.push(m);
                    }
                  }
                  conv.messages = migrated;
                }
                conversations = parsed;
                const savedActive = localStorage.getItem(ACTIVE_KEY);
                const target = conversations.find((c) => c.id === savedActive) ? savedActive : conversations[0].id;
                activeConvId = null; // reset so switchConversation doesn't skip
                switchConversation(target);
                renderConvList();
                return true;
              }
            }
          } catch { /* parse error, ignore */ }
          return false;
        }

        // --- Conversations ---
        function genId() {
          return crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        function newConversation() {
          const id = genId();
          conversations.push({ id, title: "New Chat", messages: [] });
          switchConversation(id);
          renderConvList();
          saveConversations();
          return id;
        }

        function switchConversation(id) {
          if (activeConvId === id) return;
          closeEventSource();
          activeConvId = id;
          activeRunId = null;
          setRunStatus("idle");
          renderConvList();
          renderMessages();
        }

        function getConv(id) {
          return conversations.find((c) => c.id === (id || activeConvId));
        }

        function renderConvList() {
          $convList.innerHTML = "";
          for (const c of conversations) {
            const el = document.createElement("div");
            el.className = "conv-item" + (c.id === activeConvId ? " active" : "");
            el.textContent = c.title;
            el.onclick = () => switchConversation(c.id);
            $convList.appendChild(el);
          }
        }

        // --- Messages ---
        function renderMessages() {
          $messages.innerHTML = "";
          const conv = getConv();
          if (!conv) return;
          for (const m of conv.messages) {
            appendMessageEl(m);
          }
          scrollToBottom();
        }

        function appendMessageEl(m) {
          if (m.role === "user") {
            const el = document.createElement("div");
            el.className = "msg msg-user";
            el.textContent = m.text;
            $messages.appendChild(el);
          } else if (m.role === "assistant") {
            let el = document.getElementById("assistant-msg-" + m.id);
            if (!el) {
              el = document.createElement("div");
              el.className = "msg msg-assistant";
              el.id = "assistant-msg-" + m.id;
              $messages.appendChild(el);
            }
            el.innerHTML = renderMarkdown(m.text);
          } else if (m.role === "thinking-group") {
            let el = document.getElementById("thinking-" + m.id);
            if (!el) {
              el = document.createElement("div");
              el.className = "thinking-group" + (m.done ? " done" : "");
              el.id = "thinking-" + m.id;
              const allDone = m.done || (m.tools && m.tools.every(function (t) { return t.status !== "running"; }));
              const toolCount = m.tools ? m.tools.length : 0;
              const label = allDone
                ? (toolCount > 0 ? "\u4f7f\u7528\u4e86 " + toolCount + " \u4e2a\u5de5\u5177" : "\u601d\u8003\u5b8c\u6210")
                : "LLM \u6b63\u5728\u601d\u8003\u2026";
              el.innerHTML =
                '<div class="thinking-header">' +
                '<span class="arrow">&#9654;</span>' +
                (!allDone ? '<span class="thinking-spinner"></span>' : '') +
                '<span class="thinking-label">' + escapeHtml(label) + '</span>' +
                '</div>' +
                '<div class="thinking-details"></div>';
              el.querySelector(".thinking-header").onclick = function () {
                const arrow = this.querySelector(".arrow");
                const details = this.nextElementSibling;
                arrow.classList.toggle("open");
                details.classList.toggle("open");
              };
              $messages.appendChild(el);
            }
            // Update label and done state
            if (m.done) el.classList.add("done");
            const allDone = m.done || (m.tools && m.tools.every(function (t) { return t.status !== "running"; }));
            const toolCount = m.tools ? m.tools.length : 0;
            const labelEl = el.querySelector(".thinking-label");
            if (labelEl) {
              labelEl.textContent = allDone
                ? (toolCount > 0 ? "\u4f7f\u7528\u4e86 " + toolCount + " \u4e2a\u5de5\u5177" : "\u601d\u8003\u5b8c\u6210")
                : "LLM \u6b63\u5728\u601d\u8003\u2026";
            }
            // Remove spinner if done
            if (allDone) {
              const spinner = el.querySelector(".thinking-spinner");
              if (spinner) spinner.remove();
            }
            // Render tool blocks inside details
            const detailsEl = el.querySelector(".thinking-details");
            if (detailsEl && m.tools) {
              for (const t of m.tools) {
                appendToolEl(t, detailsEl);
              }
            }
          }
        }

        function scrollToBottom() {
          requestAnimationFrame(() => {
            $messages.scrollTop = $messages.scrollHeight;
          });
        }

        function appendToolEl(t, container) {
          let el = document.getElementById("tool-" + t.id);
          if (!el) {
            el = document.createElement("div");
            el.className = "tool-block";
            el.id = "tool-" + t.id;
            el.innerHTML =
              '<div class="tool-header">' +
              '<span class="arrow">&#9654;</span>' +
              '<span class="tool-name">' + escapeHtml(t.toolName) + '</span>' +
              '<span class="tool-status">' + escapeHtml(t.status || "running") + '</span>' +
              '</div>' +
              '<div class="tool-body"><pre></pre></div>';
            el.querySelector(".tool-header").onclick = function () {
              const arrow = this.querySelector(".arrow");
              const body = this.nextElementSibling;
              arrow.classList.toggle("open");
              body.classList.toggle("open");
            };
            container.appendChild(el);
          }
          var statusEl = el.querySelector(".tool-status");
          if (statusEl) statusEl.textContent = t.status || "running";
          if (t.result !== undefined) {
            var pre = el.querySelector(".tool-body pre");
            if (pre)
              pre.textContent =
                typeof t.result === "string" ? t.result : JSON.stringify(t.result, null, 2);
          }
        }

        // --- Markdown (basic) ---
        function renderMarkdown(text) {
          if (!text) return "";
          let html = escapeHtml(text);
          // Code blocks
          html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
            return "<pre><code>" + code + "</code></pre>";
          });
          // Inline code
          html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
          // Bold
          html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
          // Italic
          html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
          // Headers
          html = html.replace(/^### (.+)$/gm, "<h4>$1</h4>");
          html = html.replace(/^## (.+)$/gm, "<h3>$1</h3>");
          html = html.replace(/^# (.+)$/gm, "<h2>$1</h2>");
          // Line breaks to paragraphs
          html = html.replace(/\n\n/g, "</p><p>");
          html = "<p>" + html + "</p>";
          html = html.replace(/<p><\/p>/g, "");
          return html;
        }

        function escapeHtml(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        // --- Run status ---
        function setRunStatus(status) {
          runStatus = status;
          $statusBar.className = status === "running" || status === "accepted" ? "running" : "";
          if (status === "idle") $statusText.textContent = "";
          else if (status === "accepted" || status === "running")
            $statusText.textContent = "Running...";
          else if (status === "completed") $statusText.textContent = "Completed";
          else if (status === "aborted") $statusText.textContent = "Aborted";
          else if (status === "failed") $statusText.textContent = "Failed";

          const isActive = status === "accepted" || status === "running";
          $sendBtn.disabled = isActive;
          $abortBtn.style.display = isActive ? "inline-block" : "none";
        }

        // --- Send message ---
        async function sendMessage() {
          const text = $input.value.trim();
          if (!text) return;
          if (!activeConvId) newConversation();
          const conv = getConv();
          if (!conv) return;

          // Update title from first message
          if (conv.messages.length === 0) {
            conv.title = text.slice(0, 40) + (text.length > 40 ? "..." : "");
            renderConvList();
          }

          conv.messages.push({ role: "user", text });
          $input.value = "";
          autoResize();
          renderMessages();
          scrollToBottom();
          saveConversations();

          setRunStatus("accepted");
          try {
            const res = await fetch(
              API + "/v1/conversations/" + encodeURIComponent(activeConvId) + "/runs",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
              },
            );
            const data = await res.json();
            if (!res.ok) {
              conv.messages.push({
                role: "assistant",
                id: genId(),
                text: "Error: " + (data.error || data.message || "request failed"),
              });
              setRunStatus("failed");
              renderMessages();
              return;
            }
            activeRunId = data.runId;
            subscribeToEvents(data.runId);
          } catch (err) {
            conv.messages.push({ role: "assistant", id: genId(), text: "Error: " + err.message });
            setRunStatus("failed");
            renderMessages();
          }
        }

        // --- SSE ---
        function subscribeToEvents(runId) {
          closeEventSource();
          const es = new EventSource(API + "/v1/runs/" + encodeURIComponent(runId) + "/events");
          activeEventSource = es;

          const conv = getConv();
          if (!conv) return;

          let currentAssistantMsg = null;
          let currentAssistantId = null;
          const toolMap = new Map();
          let currentThinkingGroup = null;

          function ensureAssistantMsg() {
            if (!currentAssistantMsg) {
              // Close any open thinking group when assistant starts speaking
              if (currentThinkingGroup && !currentThinkingGroup.done) {
                currentThinkingGroup.done = true;
                appendMessageEl(currentThinkingGroup);
              }
              currentThinkingGroup = null;

              currentAssistantId = genId();
              currentAssistantMsg = { role: "assistant", id: currentAssistantId, text: "" };
              conv.messages.push(currentAssistantMsg);
              appendMessageEl(currentAssistantMsg);
            }
            return currentAssistantMsg;
          }

          function finishRemainingTools() {
            for (const toolMsg of toolMap.values()) {
              if (toolMsg.status === "running") {
                toolMsg.status = "done";
              }
            }
            if (currentThinkingGroup) {
              currentThinkingGroup.done = true;
              appendMessageEl(currentThinkingGroup);
            }
          }

          es.onmessage = function (e) {
            let evt;
            try {
              evt = JSON.parse(e.data);
            } catch {
              return;
            }

            if (evt.type === "stream.end") {
              closeEventSource();
              if (runStatus === "accepted" || runStatus === "running") setRunStatus("completed");
              finishRemainingTools();
              // Remove trailing empty assistant message
              if (currentAssistantMsg && !currentAssistantMsg.text) {
                const idx = conv.messages.indexOf(currentAssistantMsg);
                if (idx !== -1) conv.messages.splice(idx, 1);
                const el = document.getElementById("assistant-msg-" + currentAssistantId);
                if (el) el.remove();
              }
              saveConversations();
              return;
            }

            if (evt.type === "run.started") {
              setRunStatus("running");
            } else if (evt.type === "run.completed") {
              setRunStatus("completed");
              finishRemainingTools();
              saveConversations();
              closeEventSource();
            } else if (evt.type === "run.aborted") {
              setRunStatus("aborted");
              finishRemainingTools();
              saveConversations();
              closeEventSource();
            } else if (evt.type === "run.failed") {
              setRunStatus("failed");
              finishRemainingTools();
              const msg = ensureAssistantMsg();
              if (!msg.text) {
                msg.text = "Error: " + (evt.error || "run failed");
                appendMessageEl(msg);
              }
              saveConversations();
              closeEventSource();
            } else if (evt.type === "assistant.delta") {
              const msg = ensureAssistantMsg();
              msg.text += evt.delta;
              const el = document.getElementById("assistant-msg-" + currentAssistantId);
              if (el) {
                el.innerHTML = renderMarkdown(msg.text);
                scrollToBottom();
              }
              return;
            } else if (evt.type === "tool.started") {
              // Break current assistant segment — next deltas go into a new message
              if (currentAssistantMsg && !currentAssistantMsg.text) {
                // Remove empty placeholder before tool block
                const idx = conv.messages.indexOf(currentAssistantMsg);
                if (idx !== -1) conv.messages.splice(idx, 1);
                const el = document.getElementById("assistant-msg-" + currentAssistantId);
                if (el) el.remove();
              }
              currentAssistantMsg = null;
              currentAssistantId = null;

              const toolId = evt.toolCallId || genId();
              const toolMsg = {
                id: toolId,
                toolName: evt.toolName,
                status: "running",
              };
              toolMap.set(toolId, toolMsg);

              // Create or reuse thinking group
              if (!currentThinkingGroup) {
                currentThinkingGroup = {
                  role: "thinking-group",
                  id: genId(),
                  tools: [],
                  done: false,
                };
                conv.messages.push(currentThinkingGroup);
              }
              currentThinkingGroup.tools.push(toolMsg);
              appendMessageEl(currentThinkingGroup);
              scrollToBottom();
              return;
            } else if (evt.type === "tool.result") {
              const toolId = evt.toolCallId;
              const toolMsg = toolMap.get(toolId);
              if (toolMsg) {
                toolMsg.status = "done";
                if (evt.result !== undefined) toolMsg.result = evt.result;
              }
              // Update the thinking group display
              if (currentThinkingGroup) {
                appendMessageEl(currentThinkingGroup);
              }
              scrollToBottom();
              return;
            }

            renderMessages();
            scrollToBottom();
          };

          es.onerror = function () {
            if (runStatus === "accepted" || runStatus === "running") {
              // Transient error — EventSource will auto-reconnect
            }
          };
        }

        function closeEventSource() {
          if (activeEventSource) {
            activeEventSource.close();
            activeEventSource = null;
          }
        }

        // --- Abort ---
        async function abortRun() {
          if (!activeRunId) return;
          try {
            await fetch(API + "/v1/runs/" + encodeURIComponent(activeRunId) + "/abort", {
              method: "POST",
            });
          } catch {
            /* ignore */
          }
        }

        // --- Input handling ---
        function autoResize() {
          $input.style.height = "auto";
          $input.style.height = Math.min($input.scrollHeight, 120) + "px";
        }

        $input.addEventListener("input", autoResize);
        $input.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
        $sendBtn.addEventListener("click", sendMessage);
        $abortBtn.addEventListener("click", abortRun);
        $newChatBtn.addEventListener("click", newConversation);

        // Initialize: restore from localStorage or create new conversation
        if (!loadConversations()) {
          newConversation();
        }
      })();
    </script>
  </body>
</html>
