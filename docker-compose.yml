services:
  webbot-gateway:
    image: ${WEBBOT_IMAGE:-webbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      WEBBOT_GATEWAY_TOKEN: ${WEBBOT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${WEBBOT_CONFIG_DIR}:/home/node/.webbot
      - ${WEBBOT_WORKSPACE_DIR}:/home/node/.webbot/workspace
    ports:
      - "${WEBBOT_GATEWAY_PORT:-18789}:18789"
      - "${WEBBOT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${WEBBOT_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
